# ~/.config/picom.conf — blur, coins arrondis, transparence (style Caelestia)
# Backend GLX pour profiter du GPU (bind /dev/dri dans le script de lancement).

backend = "glx";
vsync = true;

# --- Coins arrondis ---
corner-radius = 10;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'slop'",
];

# --- Ombres ---
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.45;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c",
    "class_g = 'slop'",
];

# --- Blur (flou derrière les fenêtres transparentes) ---
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-exclude = [
    "window_type = 'desktop'",
    # calque plein écran de la sélection de capture (maim -s) : sans ça tout l'écran est flouté
    "class_g = 'slop'",
];

# --- Transparence ---
inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 0.9;
# La barre Awesome gère elle-même sa transparence ; le blur s'applique derrière.
# Applis qui dessinent un fond opaque : on les rend translucides ici (le blur passe derrière).
# Pour en ajouter une : `xprop WM_CLASS` puis clic sur la fenêtre, et copier le 2e nom.
opacity-rule = [
    "100:window_type = 'dock'",
    "88:class_g = 'dev.zed.Zed' && focused",
    "80:class_g = 'dev.zed.Zed' && !focused",
    "88:class_g = 'dolphin' && focused",
    "80:class_g = 'dolphin' && !focused",
    "88:class_g = 'discord' && focused",
    "80:class_g = 'discord' && !focused",
];

# --- Fading (transitions douces) ---
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;

detect-rounded-corners = true;
detect-client-opacity = true;
use-damage = true;
